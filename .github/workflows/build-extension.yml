# 构建、打包并发布 DanmakuBox 扩展，产物可直接在 Chrome/Edge 加载
# - PR：仅校验（typecheck → lint → test）
# - push main / 手动触发：校验通过后构建产物，上传 dist 为 Actions Artifact
# - 推送 v* 标签：构建后打成 zip 并创建 GitHub Release（zip 根 = manifest.json，解压即加载）

name: build-extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 校验（typecheck/lint/test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/danmaku-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/danmaku-box/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

  package:
    name: 打包（build + Artifact）
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/danmaku-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/danmaku-box/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      # 产物红线契约：缺失任一必选文件即失败（manifest 字段级契约由 tests/public/manifest.test.ts 兜底）
      - name: 校验产物完整性
        run: |
          for f in manifest.json background.js content.js panel.html panel.css panel.js settings.html settings.css settings.js icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            test -f "dist/$f" || { echo "缺少 dist/$f"; exit 1; }
          done

      - name: 读取版本号
        id: version
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 上传扩展 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmaku-box-v${{ steps.version.outputs.version }}-chrome-edge
          path: code/danmaku-box/dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release（zip）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: code/danmaku-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/danmaku-box/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 读取版本号
        id: version
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 打包 zip（zip 根 = dist 内容）
        run: |
          cd dist
          zip -r "../danmaku-box-v${{ steps.version.outputs.version }}.zip" .
          cd ..

      - name: 创建 Release 并上传 zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          ZIP="danmaku-box-v${VERSION}.zip"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ZIP" --repo "${{ github.repository }}" --title "DanmakuBox v${VERSION}" --generate-notes
          fi
