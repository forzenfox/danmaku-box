# 构建、打包并发布 DanmakuBox 扩展，产物可直接在 Chrome/Edge 加载
# - PR / push：仅校验（typecheck → lint → test）
# - push main / 手动触发：校验通过后构建产物并上传 dist 为 Artifact，
#   同时发布 @forzenfox/danmaku-box 到 GitHub Packages（tarball 解压后目录即扩展根）
#   下载 Artifact zip / Packages tarball 后解压，manifest.json 即为扩展根目录。

name: build-extension

on:
  push:
    branches: [main]
    paths:
      - "code/danmaku-box/**"
      - ".github/workflows/build-extension.yml"
  pull_request:
    paths:
      - "code/danmaku-box/**"
      - ".github/workflows/build-extension.yml"
  workflow_dispatch:

jobs:
  validate:
    name: 校验（typecheck/lint/test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/danmaku-box
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/danmaku-box/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

  package:
    name: 打包（build + Artifact + 发布 Packages）
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: code/danmaku-box
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN 自 2025 年起被 GitHub Packages npm 注册表拒绝（401）；
      # 发布必须使用带 Packages 写权限的 fine-grained PAT（仓库 secret NPM_TOKEN）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/danmaku-box/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@forzenfox"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      # 产物红线契约：缺失任一必选文件即失败（manifest 字段级契约由 tests/public/manifest.test.ts 兜底）
      - name: 校验产物完整性
        run: |
          for f in manifest.json background.js content.js panel.html panel.css panel.js settings.html settings.css settings.js icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            test -f "dist/$f" || { echo "缺少 dist/$f"; exit 1; }
          done

      - name: 读取版本号
        id: version
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 上传扩展 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmaku-box-v${{ steps.version.outputs.version }}-chrome-edge
          path: code/danmaku-box/dist
          if-no-files-found: error
          retention-days: 30

      # 组装发布目录：复制 dist 产物并生成 scoped 临时 package.json
      # 版本号为 0.1.0-ci.{短sha} 的 prerelease，保证每次发布唯一、不覆盖旧版本
      - name: 组装发布包
        run: |
          rm -rf release-dist && mkdir release-dist && cp -r dist/. release-dist/
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('package.json')).version;const sha=process.env.GITHUB_SHA.slice(0,7);const p={name:'@forzenfox/danmaku-box',version:v+'-ci.'+sha,private:false,files:['*'],publishConfig:{access:'public'},description:'DanmakuBox 扩展发布包：解压后目录即扩展根，可直接在 Chrome/Edge 开发者模式加载'};fs.writeFileSync('release-dist/package.json',JSON.stringify(p,null,2))"

      # 目录参数必须带 ./ 前缀：npm 会把裸目录名（release-dist）解析为包名 spec 而非本地目录
      - name: 发布到 GitHub Packages
        run: npm publish ./release-dist --registry https://npm.pkg.github.com
